workflows:
  ios-capacitor:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          cd app
          npm install

      - name: Build web app
        script: |
          cd app
          npm run build

      - name: Sync Capacitor
        script: |
          cd app
          npx cap sync ios

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project app/ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - fittrackproofficiel@gmail.com