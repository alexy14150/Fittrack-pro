workflows:
  ios-capacitor:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: integration

    environment:
      node: 22
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.alexy.fittrackpro

    scripts:
      - name: Install dependencies
        script: |
          cd app
          npm install

      - name: Build web app
        script: |
          cd app
          npm run build

      - name: Sync Capacitor
        script: |
          cd app
          npx cap sync ios

      - name: Build IPA
        script: |
          cp app/ios/App/export_options.plist /Users/builder/export_options.plist
          xcode-project use-profiles
          xcode-project build-ipa \
            --project app/ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: Codemagic
        submit_to_testflight: true

      email:
        recipients:
          - alexy6300@gmail.com