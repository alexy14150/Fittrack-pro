workflows:
  ios-capacitor:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 20
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          cd application
          npm install

      - name: Build web app
        script: |
          cd application
          npm run build

      - name: Sync Capacitor
        script: |
          cd application
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd application/ios/App
          pod install

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace application/ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - fittrackproofficiel@gmail.com